name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: jamzilla-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deploy.env
        id: cfg
        run: |
          set -euo pipefail
          test -f infra/deploy.env
          # shellcheck disable=SC1091
          set -a && source infra/deploy.env && set +a
          {
            echo "aws_region=${AWS_REGION}"
            echo "s3_bucket=${S3_BUCKET}"
            echo "distribution_id=${CLOUDFRONT_DISTRIBUTION_ID}"
            echo "domain=${DOMAIN}"
            echo "role_arn=${AWS_ROLE_ARN}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.cfg.outputs.role_arn }}
          aws-region: ${{ steps.cfg.outputs.aws_region }}

      - name: Upload site files to S3
        run: |
          set -euo pipefail
          BUCKET="s3://${{ steps.cfg.outputs.s3_bucket }}"
          aws s3 cp index.html "${BUCKET}/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=60'
          # Pretty paths: /listen/ and /lineup/
          aws s3 cp listen/index.html "${BUCKET}/listen/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=60'
          aws s3 cp lineup/index.html "${BUCKET}/lineup/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=60'
          # Session tapes (gitignored binaries — present only on break-glass
          # checkouts or when an operator ran scripts/sync-audio.sh).
          # Do NOT --delete: CI without audio/ must not wipe live cuts.
          if [[ -d audio ]] && compgen -G 'audio/*' > /dev/null; then
            aws s3 sync audio "${BUCKET}/audio" \
              --exclude '.DS_Store' \
              --content-type 'audio/mpeg' \
              --cache-control 'public, max-age=86400'
          else
            echo "No local audio/ tree — leaving existing S3 audio objects alone"
          fi
          # Link-preview image (WhatsApp / Open Graph) — absolute URL in meta tags.
          aws s3 cp og-image.jpg "${BUCKET}/og-image.jpg" \
            --content-type 'image/jpeg' \
            --cache-control 'public, max-age=86400'
          # Browser tab icons
          aws s3 cp favicon.svg "${BUCKET}/favicon.svg" \
            --content-type 'image/svg+xml' \
            --cache-control 'public, max-age=86400'
          aws s3 cp favicon-32.png "${BUCKET}/favicon-32.png" \
            --content-type 'image/png' \
            --cache-control 'public, max-age=86400'
          aws s3 cp apple-touch-icon.png "${BUCKET}/apple-touch-icon.png" \
            --content-type 'image/png' \
            --cache-control 'public, max-age=86400'
          if [[ -d assets ]]; then
            aws s3 sync assets "${BUCKET}/assets" \
              --delete \
              --cache-control 'public, max-age=86400'
          fi

      - name: Ensure CloudFront directory-index rewrite
        run: |
          set -euo pipefail
          chmod +x infra/ensure-directory-index.sh
          infra/ensure-directory-index.sh

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfg.outputs.distribution_id }}" \
            --paths '/*'

      - name: Smoke public URL
        run: |
          set -euo pipefail
          URL="https://${{ steps.cfg.outputs.domain }}"
          echo "Probing ${URL}"
          for i in $(seq 1 60); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${URL}" || true)"
            echo "  try ${i}: HTTP ${CODE}"
            if [[ "${CODE}" != "200" ]]; then
              sleep 10
              continue
            fi
            TITLE="$(curl -sS --max-time 15 "${URL}" | tr '\n' ' ' | grep -o '<title>[^<]*</title>' | head -1 || true)"
            echo "  ${TITLE}"
            LINEUP_TITLE="$(curl -sS --max-time 15 "${URL}/lineup/" | tr '\n' ' ' | grep -o '<title>[^<]*</title>' | head -1 || true)"
            LISTEN_TITLE="$(curl -sS --max-time 15 "${URL}/listen/" | tr '\n' ' ' | grep -o '<title>[^<]*</title>' | head -1 || true)"
            echo "  /lineup/ ${LINEUP_TITLE}"
            echo "  /listen/ ${LISTEN_TITLE}"
            # Custom error responses return homepage HTML with 200 — require real titles.
            if ! echo "${LINEUP_TITLE}" | grep -qi 'Lineup' \
              || ! echo "${LISTEN_TITLE}" | grep -qiE 'Listen|Recordings'; then
              echo "  waiting for directory-index rewrite / cache…"
              sleep 10
              continue
            fi
            # Ready Listen cuts must be real MPEG, not CF custom-error HTML.
            AUDIO_OK=1
            for cut in curbing-the-slide hanging-in-the-hills; do
              CT="$(curl -sS -I --max-time 15 "${URL}/audio/${cut}.mp3" \
                | tr -d '\r' \
                | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}')"
              echo "  /audio/${cut}.mp3 Content-Type: ${CT}"
              if ! echo "${CT}" | grep -qi 'audio/mpeg'; then
                AUDIO_OK=0
              fi
            done
            if [[ "${AUDIO_OK}" -eq 1 ]]; then
              exit 0
            fi
            echo "  waiting for audio objects / cache…"
            sleep 10
          done
          echo "Smoke failed — pretty pages or /audio/*.mp3 (need audio/mpeg) not ready" >&2
          exit 1
